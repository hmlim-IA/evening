<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보고 생성기</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      padding: 20px;
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 20px;
    }

    .mode-selector {
      margin-bottom: 24px;
      background: white;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .mode-selector label {
      display: inline-block;
      margin-right: 20px;
      font-weight: bold;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    textarea,
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate-btn {
      background: #111;
      color: white;
    }

    .copy-btn {
      background: #2d7ef7;
      color: white;
    }

    .output {
      white-space: pre-wrap;
      background: white;
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #ddd;
      min-height: 120px;
    }
  </style>
</head>

<body>

<h1>보고 생성기</h1>

<div class="mode-selector">
  <label>
    <input type="radio" name="mode" value="weekday" checked onchange="switchMode()">
    평일 보고
  </label>

  <label>
    <input type="radio" name="mode" value="wednesday" onchange="switchMode()">
    수요일 보고
  </label>
</div>

<!-- 평일 보고 -->
<div id="weekdaySection" class="section active">

  <label>보고일</label>
  <input type="date" id="weekdayReportDate">

  <label>경매결과</label>
  <textarea id="auctionResult"
placeholder="예시) 5/20(목) 경기도 지방채 5년 국+32bp 1978억 낙찰(총응찰 3700억)"></textarea>

  <label>기타업무</label>
  <textarea id="otherWork"
placeholder="예시)어디어디 공사 입찰 공고 등록"></textarea>

  <label>타사 입찰동향</label>
  <textarea id="bidTrend"
placeholder="예시) 5/20(목) 한국전력공사 5년 유찰"></textarea>

  <label>익일업무</label>
  <textarea id="nextDayWork"
placeholder="예시) 경매 진행 및 정리"></textarea>

  <label>직원동향</label>
  <textarea id="staffStatus"
placeholder="예시) 오하은 사원 휴가(5/20, 연차)"></textarea>

  <label>금주 경매일정</label>
  <textarea id="thisWeekAuction"
placeholder="5월 3주 경매일정 이런 식으로 쓰고 시작, 대신 <>는 자동으로 붙음"></textarea>

  <label>차주 경매일정</label>
  <textarea id="nextWeekAuction"
placeholder="5월 3주 경매일정 이런 식으로 쓰고 시작, 대신 <>는 자동으로 붙음"></textarea>

  <button class="generate-btn" onclick="generateWeekdayText()">
    평일 보고 생성하기
  </button>

</div>

<!-- 수요일 보고 -->
<div id="wednesdaySection" class="section">

  <label>보고일</label>
  <input type="date" id="wednesdayReportDate">

  <label>금주 경매결과</label>
  <textarea id="wedAuctionResult"
placeholder="월~수 경매결과를 적으세요. 숫자는 자동으로 입력, 돈 안받는 전단채는 제외"></textarea>

  <label>타사 입찰동향</label>
  <textarea id="wedBidTrend"
placeholder="타사도 돈 안 받는 전단채는 제외"></textarea>

  <label>금주 경매일정</label>
  <textarea id="wedThisWeekAuction"
placeholder="5월 3주 경매일정 이런 식으로 쓰고 시작, 대신 [ ]는자동으로 붙음"></textarea>

  <label>차주 경매일정</label>
  <textarea id="wedNextWeekAuction"
placeholder="5월 3주 경매일정 이런 식으로 쓰고 시작, 대신 [ ]는자동으로 붙음"></textarea>

  <button class="generate-btn" onclick="generateWednesdayText()">
    수요일 보고 생성하기
  </button>

</div>

<button class="copy-btn" onclick="copyText()">
  복사하기
</button>

<div class="output" id="output"></div>

<script>

function switchMode() {

  var mode =
    document.querySelector('input[name="mode"]:checked').value;

  document.getElementById('weekdaySection')
    .classList.remove('active');

  document.getElementById('wednesdaySection')
    .classList.remove('active');

  if (mode === 'weekday') {

    document.getElementById('weekdaySection')
      .classList.add('active');

  } else {

    document.getElementById('wednesdaySection')
      .classList.add('active');
  }
}

function formatDate(dateString) {

  var weekdays =
    ['일', '월', '화', '수', '목', '금', '토'];

  var date = new Date(dateString);

  var year = date.getFullYear();

  var month =
    String(date.getMonth() + 1).padStart(2, '0');

  var day =
    String(date.getDate()).padStart(2, '0');

  var weekday =
    weekdays[date.getDay()];

  return year + '.' + month + '.' + day +
    ' (' + weekday + ')';
}

function bulletFormat(text, doubleSpacing) {

  if (!text || text.trim() === '') {
    return '';
  }

  var lines = text.split('\n');

  var result = '';

  for (var i = 0; i < lines.length; i++) {

    var line = lines[i].trim();

    if (line !== '') {

      if (result !== '') {

        if (doubleSpacing) {
          result += '\n\n';
        } else {
          result += '\n';
        }
      }

      result += '- ' + line;
    }
  }

  return result;
}

function auctionResultFormat(text) {

  if (!text || text.trim() === '') {
    return '';
  }

  var lines = text.split('\n');

  var result = '';

  var number = 1;

  for (var i = 0; i < lines.length; i++) {

    var line = lines[i].trim();

    if (line !== '') {

      if (result !== '') {
        result += '\n';
      }

      if (
        line.indexOf('(상세)') === 0 ||
        line.indexOf('누적수익') !== -1
      ) {

        result += line;

      } else {

        result += number + ') ' + line;

        number++;
      }
    }
  }

  return result;
}

function auctionScheduleFormat(text, bracketType) {

  if (!text || text.trim() === '') {
    return '';
  }

  var lines = text.split('\n');

  var title = lines[0].trim();

  var result = '';

  if (bracketType === 'square') {
    result = '[' + title + ']';
  } else {
    result = '<' + title + '>';
  }

  var number = 1;

  for (var i = 1; i < lines.length; i++) {

    var line = lines[i].trim();

    if (line !== '') {

      result += '\n';

      if (
        line.indexOf('(상세)') === 0 ||
        line.indexOf('누적수익') !== -1
      ) {

        result += line;

      } else {

        result += number + ') ' + line;

        number++;
      }
    }
  }

  return result;
}

function generateWeekdayText() {

  var reportDate =
    document.getElementById('weekdayReportDate').value;

  var auctionResult =
    document.getElementById('auctionResult').value;

  var otherWork =
    document.getElementById('otherWork').value;

  var bidTrend =
    document.getElementById('bidTrend').value;

  var nextDayWork =
    document.getElementById('nextDayWork').value;

  var staffStatus =
    document.getElementById('staffStatus').value;

  var thisWeekAuction =
    document.getElementById('thisWeekAuction').value;

  var nextWeekAuction =
    document.getElementById('nextWeekAuction').value;

  var result = '';

  result += formatDate(reportDate);

  result += '\n\n';

  result += '1. 주요업무\n';

  result += '<경매결과>\n';

  result += auctionResultFormat(auctionResult);

  result += '\n\n';

  var otherText =
    bulletFormat(otherWork, true);

  if (otherText !== '') {

    result += otherText;

    result += '\n\n';
  }

  result += '2. 타사 입찰동향\n';

  result += bidTrend.trim();

  result += '\n\n';

  result += '3. 익일업무\n';

  result += bulletFormat(nextDayWork, false);

  result += '\n';

  if (staffStatus.trim() !== '') {

    result += '\n4. 직원동향\n';

    result += staffStatus.trim();

    result += '\n';
  }

  var thisWeekText =
    auctionScheduleFormat(
      thisWeekAuction,
      'angle'
    );

  if (thisWeekText !== '') {

    result += '\n';

    result += thisWeekText;

    result += '\n';
  }

  var nextWeekText =
    auctionScheduleFormat(
      nextWeekAuction,
      'angle'
    );

  if (nextWeekText !== '') {

    result += '\n';

    result += nextWeekText;
  }

  document.getElementById('output').innerText =
    result.trim();
}

function generateWednesdayText() {

  var reportDate =
    document.getElementById('wednesdayReportDate').value;

  var auctionResult =
    document.getElementById('wedAuctionResult').value;

  var bidTrend =
    document.getElementById('wedBidTrend').value;

  var thisWeekAuction =
    document.getElementById('wedThisWeekAuction').value;

  var nextWeekAuction =
    document.getElementById('wedNextWeekAuction').value;

  var result = '';

  result += formatDate(reportDate);

  result += '\n\n';

  var resultSection =
    auctionScheduleFormat(
      auctionResult,
      'square'
    );

  if (resultSection !== '') {

    result += resultSection;

    result += '\n\n';
  }

  result += '[타사 입찰동향]';

  if (bidTrend.trim() !== '') {

    result += '\n';

    result += bidTrend.trim();
  }

  result += '\n\n';

  var thisWeekText =
    auctionScheduleFormat(
      thisWeekAuction,
      'square'
    );

  if (thisWeekText !== '') {

    result += thisWeekText;

    result += '\n\n';
  }

  var nextWeekText =
    auctionScheduleFormat(
      nextWeekAuction,
      'square'
    );

  if (nextWeekText !== '') {

    result += nextWeekText;
  }

  document.getElementById('output').innerText =
    result.trim();
}

function copyText() {

  var text =
    document.getElementById('output').innerText;

  navigator.clipboard.writeText(text)
    .then(function () {

      alert('복사 완료');

    })
    .catch(function () {

      alert('복사 실패');

    });
}

window.onload = function () {

  var today =
    new Date().toISOString().split('T')[0];

  document.getElementById('weekdayReportDate').value =
    today;

  document.getElementById('wednesdayReportDate').value =
    today;
};

</script>

</body>
</html>
