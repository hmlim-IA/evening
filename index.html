<!DOCTYPE html>

<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마감 보고 생성기</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      padding: 20px;
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate-btn {
      background: #111;
      color: white;
    }

    .copy-btn {
      background: #2d7ef7;
      color: white;
    }

    .output {
      white-space: pre-wrap;
      background: white;
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #ddd;
      min-height: 120px;
    }
  </style>

</head>

<body>

  <h1>마감 보고 생성기</h1>

<label>보고일</label> <input type="date" id="reportDate">

<label>경매결과</label>

  <textarea id="auctionResult" placeholder="예시) 5/15(금) 한국가스공사 전단채 7일 2.53% 1900억 낙찰(총응찰 4400억) : 번호는 자동으로 들어가요!"></textarea>

<label>기타업무</label>

  <textarea id="otherWork" placeholder="예시) 한국가스공사 전단채 공고 등록"></textarea>

<label>타사 입찰동향</label>

  <textarea id="bidTrend" placeholder="예시) 5/19(화) 부산항만공사 2년 500억, 3년 1000억(이데일리)"></textarea>

<label>익일업무</label>

  <textarea id="nextDayWork" placeholder="예시) 경매 진행 및 정리"></textarea>

<label>직원동향</label>

  <textarea id="staffStatus" placeholder="임희만 팀장 휴가(5/22, 연차)"></textarea>

<label>금주 경매일정</label>

  <textarea id="thisWeekAuction" placeholder="앞에 꼭 몇월 몇주 경매일정이라고 넣으세요. 대신 <>은 자동으로 들어감"></textarea>

<label>차주 경매일정</label>

  <textarea id="nextWeekAuction" placeholder="앞에 꼭 몇월 몇주 경매일정이라고 넣으세요. 대신 <>은 자동으로 들어감"></textarea>

  <button class="generate-btn" onclick="generateText()">
    보고 생성하기
  </button>

  <button class="copy-btn" onclick="copyText()">
    복사하기
  </button>

  <div class="output" id="output"></div>

  <script>

    function formatDate(dateString) {

      var weekdays = ['일', '월', '화', '수', '목', '금', '토'];

      var date = new Date(dateString);

      var year = date.getFullYear();
      var month = String(date.getMonth() + 1).padStart(2, '0');
      var day = String(date.getDate()).padStart(2, '0');

      var weekday = weekdays[date.getDay()];

      return year + '.' + month + '.' + day + ' (' + weekday + ')';
    }

    function bulletFormat(text, doubleSpacing) {

      if (!text || text.trim() === '') {
        return '';
      }

      var lines = text.split('\n');

      var result = '';

      for (var i = 0; i < lines.length; i++) {

        var line = lines[i].trim();

        if (line !== '') {

          if (result !== '') {

            if (doubleSpacing) {
              result += '\n\n';
            } else {
              result += '\n';
            }

          }

          result += '- ' + line;
        }
      }

      return result;
    }

    function auctionScheduleFormat(text) {

      if (!text || text.trim() === '') {
        return '';
      }

      var lines = text.split('\n');

      var title = lines[0].trim();

      var result = '<' + title + '>';

      var number = 1;

      for (var i = 1; i < lines.length; i++) {

        var line = lines[i].trim();

        if (line !== '') {

          result += '\n' + number + ') ' + line;

          number++;
        }
      }

      return result;
    }

    function auctionResultFormat(text) {

      if (!text || text.trim() === '') {
        return '';
      }

      var lines = text.split('\n');

      var result = '';

      var number = 1;

      for (var i = 0; i < lines.length; i++) {

        var line = lines[i].trim();

        if (line !== '') {

          if (result !== '') {
            result += '\n';
          }

          if (
            line.indexOf('(상세)') === 0 ||
            line.indexOf('누적수익') !== -1
          ) {

            result += line;

          } else {

            result += number + ') ' + line;

            number++;
          }
        }
      }

      return result;
    }

    function generateText() {

      var reportDate = document.getElementById('reportDate').value;

      var auctionResult = document.getElementById('auctionResult').value;

      var otherWork = document.getElementById('otherWork').value;

      var bidTrend = document.getElementById('bidTrend').value;

      var nextDayWork = document.getElementById('nextDayWork').value;

      var staffStatus = document.getElementById('staffStatus').value;

      var thisWeekAuction = document.getElementById('thisWeekAuction').value;

      var nextWeekAuction = document.getElementById('nextWeekAuction').value;

      var result = '';

      result += formatDate(reportDate);

      result += '\n\n';

      result += '1. 주요업무';

      result += '\n';

      result += '<경매결과>';

      result += '\n';

      result += auctionResultFormat(auctionResult);

      result += '\n\n';

      var otherText = bulletFormat(otherWork, true);

      if (otherText !== '') {

        result += otherText;

        result += '\n\n';
      }

      result += '2. 타사 입찰동향';

      result += '\n';

      result += bidTrend.trim();

      result += '\n\n';

      result += '3. 익일업무';

      result += '\n';

      result += bulletFormat(nextDayWork, false);

      result += '\n';

      if (staffStatus.trim() !== '') {

        result += '\n4. 직원동향';

        result += '\n';

        result += staffStatus.trim();

        result += '\n';
      }

      var thisWeekText = auctionScheduleFormat(thisWeekAuction);

      if (thisWeekText !== '') {

        result += '\n';

        result += thisWeekText;

        result += '\n';
      }

      var nextWeekText = auctionScheduleFormat(nextWeekAuction);

      if (nextWeekText !== '') {

        result += '\n';

        result += nextWeekText;

        result += '\n';
      }

      document.getElementById('output').innerText = result;
    }

    function copyText() {

      var text = document.getElementById('output').innerText;

      navigator.clipboard.writeText(text)
        .then(function () {
          alert('복사 완료');
        })
        .catch(function () {
          alert('복사 실패');
        });
    }

    window.onload = function () {

      var today = new Date().toISOString().split('T')[0];

      document.getElementById('reportDate').value = today;
    };

  </script>

</body>
</html>
